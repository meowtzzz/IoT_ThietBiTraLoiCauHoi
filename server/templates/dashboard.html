<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hệ thống trả lời trắc nghiệm</title>
<style>
:root{--ink:#18233b;--muted:#71809a;--line:#e7ebf2;--paper:#fff;--bg:#f4f6fb;--blue:#4359d9;--blue2:#eef0ff;--green:#16865f;--red:#d44958;--shadow:0 8px 26px #1b2a4b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:not-allowed}.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:256px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;gap:12px;align-items:center;padding:3px 8px 28px}.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#5268eb,#273bb4);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800}.brand strong{display:block;font-size:14px;line-height:1.3}.brand small{color:var(--muted);font-size:11px}.nav-label{font-size:10px;letter-spacing:.13em;font-weight:800;color:#9aa5b8;padding:5px 12px 10px}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;color:#65718a;padding:11px 12px;border-radius:10px;font-weight:600;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:var(--blue2);color:var(--blue)}.nav-icon{width:20px;text-align:center;font-size:17px}.side-foot{margin-top:auto;padding:15px 10px;color:#9aa5b8;font-size:11px;border-top:1px solid var(--line)}main{margin-left:256px;padding:32px clamp(20px,4vw,56px) 56px;max-width:1600px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:16px}.eyebrow{font-size:12px;color:var(--muted)}h1{margin:2px 0;font-size:27px;letter-spacing:-.03em}h2{margin:0 0 16px;font-size:18px}h3{margin:0;font-size:16px}.profile{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;color:#43506a;font-weight:600}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:18px}.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat,.panel,.class-card,.quiz-card{background:var(--paper);border:1px solid #e9edf4;border-radius:15px;box-shadow:var(--shadow)}.stat{padding:20px}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:30px;font-weight:750;letter-spacing:-.04em;margin-top:7px}.stat-icon{float:right;width:38px;height:38px;border-radius:11px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;font-size:18px}.panel{padding:22px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}.panel-head h2{margin:0}.split{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.active-card{background:linear-gradient(120deg,#253aa8,#5068e9);color:#fff;border-radius:16px;padding:25px;box-shadow:0 12px 28px #3448ba2b}.active-card .muted{color:#d7ddff}.active-top{display:flex;justify-content:space-between;gap:16px}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;background:#eaf8f1;color:var(--green)}.pill.closed{background:#fff3e9;color:#a56121}.pill.light{background:#ffffff25;color:white}.dot{width:7px;height:7px;background:currentColor;border-radius:50%}.btn{padding:10px 14px;border-radius:9px;font-weight:700;transition:.15s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--blue);color:#fff}.secondary{background:#f0f2f8;color:#35415b}.white-btn{background:#fff;color:#3449c0}.danger{background:#fff0f0;color:#b73c4b}.outline{background:#fff;border:1px solid var(--line);color:#34415b}.sm{padding:7px 10px;font-size:13px}.large-stat{font-size:30px;font-weight:750;margin:15px 0 4px}.class-grid,.quiz-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.class-card,.quiz-card{padding:21px;transition:.17s}.class-card:hover,.quiz-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px #1b2a4b12}.class-code{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--blue);background:var(--blue2);padding:5px 8px;border-radius:7px;display:inline-block;margin-bottom:12px}.card-title{font-size:17px;font-weight:750;margin-bottom:5px}.card-meta{color:var(--muted);font-size:13px;margin:15px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin:20px 0 18px}.tabs button{background:none;color:var(--muted);padding:10px 13px;border-bottom:2px solid transparent;font-weight:650}.tabs button.active{color:var(--blue);border-color:var(--blue)}label{display:block;font-size:13px;font-weight:700;color:#47536d;margin-bottom:6px}.field{width:100%;border:1px solid #dfe4ed;border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:#8190f0;box-shadow:0 0 0 3px #4359d91a}textarea.field{min-height:84px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#121a2d77;display:grid;place-items:center;padding:16px;z-index:20}.modal{background:#fff;border-radius:16px;padding:25px;width:min(510px,100%);box-shadow:0 22px 80px #111a3540}.modal h2{margin-bottom:18px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.question-editor{border:1px solid var(--line);border-radius:13px;padding:18px;margin:14px 0;background:#fbfcff}.question-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.option-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option-input{position:relative}.option-input b{position:absolute;top:10px;left:11px;color:var(--blue)}.option-input input{padding-left:34px}.live-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(290px,.7fr);gap:18px}.question-live{padding:26px}.question-number{font-size:12px;color:var(--blue);font-weight:800;letter-spacing:.08em}.question-live h2{font-size:22px;line-height:1.4;margin:12px 0 20px}.answer-choice{background:#f6f7fb;padding:12px 14px;border-radius:10px;margin:8px 0}.answer-choice b{color:var(--blue);display:inline-block;width:26px}.live-controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.bar-row{display:grid;grid-template-columns:24px 1fr 72px;gap:10px;align-items:center;margin:14px 0}.bar-track{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#5369ea,#8291fc);transition:width .35s}.bar-count{text-align:right;font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #edf0f5;font-size:13px}th{color:#8490a5;font-size:11px;text-transform:uppercase;letter-spacing:.06em}tbody tr:last-child td{border:0}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#e8f7ef;color:#16865f}.badge.bad{background:#fff0f0;color:#c34451}.empty{text-align:center;padding:46px 18px;color:var(--muted)}.empty .emoji{font-size:30px;margin-bottom:8px}.notice{padding:12px 14px;border-radius:10px;background:#f1f4ff;color:#4356bb;font-size:13px;margin:12px 0}.toast{position:fixed;bottom:22px;right:22px;background:#172440;color:#fff;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:40}.mobile-menu{display:none}
@media(max-width:1100px){.class-grid,.quiz-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.live-layout{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{width:74px;padding:18px 10px}.brand{padding:4px 5px 25px}.brand-copy,.nav-label,.nav-text,.side-foot{display:none}.brand-mark{width:46px;height:46px}.nav button{justify-content:center;padding:12px}.nav-icon{font-size:19px}main{margin-left:74px;padding:22px 15px 40px}.topbar{align-items:flex-start}.topbar h1{font-size:23px}.profile{display:none}.class-grid,.quiz-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.option-fields{grid-template-columns:1fr}.panel{padding:17px}.stats-grid{gap:10px}.stat{padding:14px}.stat-value{font-size:25px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">✓</div><div class="brand-copy"><strong>Hệ thống trả lời trắc nghiệm</strong><small>ESP32 Classroom Response System</small></div></div>
  <div class="nav-label">KHÔNG GIAN LÀM VIỆC</div>
  <nav class="nav">
    <button data-nav="overview" onclick="navigate('overview')"><span class="nav-icon">⌂</span><span class="nav-text">Tổng quan</span></button>
    <button data-nav="classes" onclick="navigate('classes')"><span class="nav-icon">▦</span><span class="nav-text">Lớp học</span></button>
    <button data-nav="quizzes" onclick="navigate('quizzes')"><span class="nav-icon">▤</span><span class="nav-text">Bài kiểm tra</span></button>
    <button data-nav="results" onclick="navigate('results')"><span class="nav-icon">◷</span><span class="nav-text">Kết quả</span></button>
  </nav>
  <div class="side-foot">Classroom Response · v2.0</div>
</aside>
<main>
  <header class="topbar"><div><div class="eyebrow" id="breadcrumb">Không gian giảng viên</div><h1 id="page-title">Tổng quan</h1></div><div class="profile">✦ &nbsp; Giảng viên</div></header>
  <section id="app"></section>
</main>
</div>
<div id="overlay"></div><div id="toast-root"></div>
<script>
const appRoot=document.getElementById('app');
let route={page:'overview'},liveTimer=null,liveData=null,editorQuestions=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nfmt=v=>Number(v||0).toLocaleString('vi-VN');
function toast(message){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>root.innerHTML='',2600)}
async function api(url,options={}){const res=await fetch(url,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let data={};try{data=await res.json()}catch{}if(!res.ok)throw Error(data.message||`Lỗi HTTP ${res.status}`);return data}
function titleFor(page){return ({overview:'Tổng quan',classes:'Lớp học',quizzes:'Bài kiểm tra',results:'Kết quả',detail:'Chi tiết lớp',editor:'Tạo bài kiểm tra',live:'Phiên trực tiếp',result:'Kết quả phiên'})[page]||'Tổng quan'}
async function navigate(page,params={}){if(route.page==='live'&&page!=='live'&&liveData?.session?.status==='active'){if(!confirm('Bạn có chắc muốn kết thúc phiên kiểm tra này và rời màn hình trực tiếp?'))return;try{await api(`/api/sessions/${route.sessionId}/control`,{method:'POST',body:JSON.stringify({action:'end'})});liveData.session.status='completed'}catch(e){toast(e.message);return}}if(liveTimer){clearInterval(liveTimer);liveTimer=null}route={page,...params};render()}
function setHeader(){document.getElementById('page-title').textContent=titleFor(route.page);document.getElementById('breadcrumb').textContent=route.page==='detail'||route.page==='editor'||route.page==='live'||route.page==='result'?'Quản lý lớp học · '+(route.className||'Chi tiết'):'Không gian giảng viên';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(route.page==='detail'||route.page==='editor'||route.page==='live'?'classes':route.page==='result'?'results':route.page)))}
function statCard(icon,label,value){const shown=typeof value==='string'?esc(value):nfmt(value);return `<div class="stat"><span class="stat-icon">${icon}</span><div class="stat-label">${label}</div><div class="stat-value">${shown}</div></div>`}
function empty(title,subtitle,button=''){return `<div class="empty"><div class="emoji">✦</div><strong>${esc(title)}</strong><div class="small" style="margin:5px 0 16px">${esc(subtitle)}</div>${button}</div>`}
async function render(){setHeader();try{if(route.page==='overview')await renderOverview();else if(route.page==='classes')await renderClasses();else if(route.page==='detail')await renderDetail();else if(route.page==='quizzes')await renderQuizzes();else if(route.page==='editor')await renderEditor();else if(route.page==='live')await renderLive();else if(route.page==='results')await renderResults();else if(route.page==='result')await renderResult();}catch(e){appRoot.innerHTML=empty('Không tải được dữ liệu',e.message,'<button class="btn outline" onclick="render()">Thử lại</button>')}}
async function renderOverview(){const d=await api('/api/overview');appRoot.innerHTML=`<div class="grid stats-grid">${statCard('▦','Tổng số lớp',d.classes)}${statCard('▤','Bài kiểm tra',d.quizzes)}${statCard('♙','Sinh viên',d.students)}${statCard('↗','Lượt trả lời',d.responses)}</div>${d.active_session?`<div class="active-card"><div class="active-top"><div><div class="muted small">ĐANG DIỄN RA</div><h2 style="margin:5px 0 2px">${esc(d.active_session.quiz_title)}</h2><div class="muted">${esc(d.active_session.class_name)} · Câu ${esc(d.active_session.question_order||1)} / ${d.active_session.question_count}</div></div><span class="pill light"><i class="dot"></i>${d.active_session.accepting_answers?'Đang nhận đáp án':'Đã đóng'}</span></div><div class="row between" style="margin-top:20px"><div><span class="large-stat">${nfmt(d.active_session.answered)}</span><span class="muted"> lượt trả lời câu này</span></div><button class="btn white-btn" onclick="navigate('live',{sessionId:${d.active_session.session_id}})">Đi tới phiên đang hoạt động →</button></div></div>`:`<div class="panel"><div class="panel-head"><div><h2>Sẵn sàng cho buổi học mới?</h2><div class="muted">Tạo lớp, chuẩn bị bài kiểm tra và bắt đầu phiên trực tiếp.</div></div><button class="btn primary" onclick="navigate('classes')">Mở danh sách lớp</button></div></div>`}<div class="split" style="margin-top:18px"><div class="panel"><div class="panel-head"><h2>Bắt đầu nhanh</h2></div><div class="row"><button class="btn secondary" onclick="openClassModal()">＋ Tạo lớp học</button><button class="btn secondary" onclick="navigate('classes')">▤ Quản lý bài kiểm tra</button></div></div><div class="panel"><div class="panel-head"><h2>Luồng trả lời</h2><span class="pill"><i class="dot"></i>ESP32 sẵn sàng</span></div><div class="muted small">Thiết bị gửi MSSV và đáp án tới <code>POST /answer</code>. Máy chủ tự gắn câu trả lời vào phiên đang mở.</div></div></div>`}
async function renderClasses(){const rows=await api('/api/classes');appRoot.innerHTML=`<div class="panel-head"><div><h2 style="margin:0">Danh sách lớp</h2><div class="muted small">Quản lý lớp học và bài kiểm tra theo từng lớp.</div></div><button class="btn primary" onclick="openClassModal()">＋ Tạo lớp mới</button></div>${rows.length?`<div class="grid class-grid">${rows.map(c=>`<article class="class-card"><span class="class-code">${esc(c.class_code)}</span><div class="card-title">${esc(c.class_name)}</div><div class="muted small">${esc(c.description||'Chưa có mô tả')}</div><div class="card-meta">♙ ${nfmt(c.student_count)} sinh viên &nbsp; · &nbsp; ▤ ${nfmt(c.quiz_count)} bài kiểm tra</div><button class="btn secondary sm" onclick="navigate('detail',{classId:${c.id}})">Mở lớp →</button></article>`).join('')}</div>`:empty('Chưa có lớp học','Tạo lớp đầu tiên để bắt đầu quản lý bài kiểm tra.','<button class="btn primary" onclick="openClassModal()">＋ Tạo lớp mới</button>')}`}
function openClassModal(){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Tạo lớp học mới</h2><form onsubmit="createClass(event)"><div class="form-grid"><div><label>Mã lớp</label><input class="field" name="class_code" placeholder="VD: IOT-2026" required></div><div><label>Tên lớp</label><input class="field" name="class_name" placeholder="VD: IoT - Thứ 3 Ca 1" required></div><div class="full"><label>Mô tả <span class="muted">(không bắt buộc)</span></label><textarea class="field" name="description" placeholder="Thông tin về lớp học"></textarea></div></div><div class="form-actions"><button type="button" class="btn outline" onclick="closeModal()">Hủy</button><button class="btn primary">Tạo lớp</button></div></form></div></div>`}
function closeModal(){document.getElementById('overlay').innerHTML=''}
async function createClass(e){e.preventDefault();const f=new FormData(e.target);try{await api('/api/classes',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});closeModal();toast('Đã tạo lớp học');render()}catch(err){toast(err.message)}}
async function renderDetail(){const c=await api(`/api/classes/${route.classId}`);route.className=c.class_name;setHeader();const tab=route.tab||'quizzes';let content='';if(tab==='quizzes')content=c.quizzes.length?`<div class="grid quiz-grid">${c.quizzes.map(q=>`<article class="quiz-card"><div class="row between"><span class="class-code">${q.question_count} câu hỏi</span><span class="muted small">${esc(String(q.created_at).slice(0,10))}</span></div><div class="card-title">${esc(q.title)}</div><div class="muted small">${esc(q.description||'Bài kiểm tra đã lưu')}</div><div class="actions" style="margin-top:18px"><button class="btn primary sm" onclick="startQuiz(${q.id})">▶ Bắt đầu</button><button class="btn outline sm" onclick="editQuiz(${q.id})">Chỉnh sửa</button></div></article>`).join('')}</div>`:empty('Chưa có bài kiểm tra','Tạo câu hỏi trước, sau đó bạn có thể dùng lại bài kiểm tra bất cứ lúc nào.');else if(tab==='students')content=`<div class="panel"><div class="panel-head"><div><h2>Danh sách sinh viên</h2><div class="muted small">Thêm sinh viên vào lớp. MSSV gửi từ ESP32 cũng sẽ tự được ghi danh khi tham gia.</div></div></div><form class="row" onsubmit="addStudent(event)" style="margin-bottom:16px"><input class="field" style="max-width:220px" name="mssv" placeholder="Mã số sinh viên" required><input class="field" style="max-width:240px" name="name" placeholder="Họ tên"><button class="btn primary">Thêm sinh viên</button></form>${c.students.length?table(['MSSV','Họ và tên','Ngày tham gia'],c.students.map(s=>[esc(s.mssv),esc(s.name||'—'),esc(String(s.joined_at).slice(0,10))])):empty('Chưa có sinh viên','Bạn có thể nhập danh sách ở trên.')}</div>`;else content=c.history.length?table(['Bài kiểm tra','Ngày bắt đầu','Trạng thái','Lượt trả lời',''],c.history.map(s=>[esc(s.quiz_title),esc(String(s.started_at).slice(0,16)),s.status==='active'?'<span class="pill">Đang diễn ra</span>':'<span class="pill closed">Đã kết thúc</span>',nfmt(s.response_count),`<button class="btn outline sm" onclick="navigate('${s.status==='active'?'live':'result'}',{sessionId:${s.id}})">${s.status==='active'?'Mở phiên':'Xem kết quả'}</button>`])):empty('Chưa có lịch sử','Các phiên kiểm tra đã kết thúc sẽ xuất hiện tại đây.');appRoot.innerHTML=`<div class="panel-head"><div><button class="btn outline sm" onclick="navigate('classes')">← Tất cả lớp</button><div class="class-code" style="margin:12px 0 4px">${esc(c.class_code)}</div><h2 style="margin:0">${esc(c.class_name)}</h2><div class="muted small">${esc(c.description||'')}</div></div><button class="btn primary" onclick="newQuiz(${c.id})">＋ Tạo bài kiểm tra</button></div><div class="tabs"><button class="${tab==='quizzes'?'active':''}" onclick="detailTab('quizzes')">Bài kiểm tra</button><button class="${tab==='students'?'active':''}" onclick="detailTab('students')">Sinh viên (${c.student_count})</button><button class="${tab==='history'?'active':''}" onclick="detailTab('history')">Lịch sử</button></div>${content}`}
function detailTab(tab){route.tab=tab;renderDetail()}
function table(headers,rows){return `<div class="panel table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
async function addStudent(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api(`/api/classes/${route.classId}/students`,{method:'POST',body:JSON.stringify(data)});toast('Đã thêm sinh viên');renderDetail()}catch(err){toast(err.message)}}
async function renderQuizzes(){const classes=await api('/api/classes');appRoot.innerHTML=`<div class="panel-head"><div><h2 style="margin:0">Bài kiểm tra theo lớp</h2><div class="muted small">Chọn lớp để xem, tạo hoặc sử dụng bài kiểm tra đã lưu.</div></div></div>${classes.length?`<div class="grid class-grid">${classes.map(c=>`<article class="class-card"><span class="class-code">${esc(c.class_code)}</span><div class="card-title">${esc(c.class_name)}</div><div class="card-meta">${nfmt(c.quiz_count)} bài kiểm tra · ${nfmt(c.student_count)} sinh viên</div><button class="btn secondary sm" onclick="navigate('detail',{classId:${c.id}})">Xem bài kiểm tra →</button></article>`).join('')}</div>`:empty('Chưa có lớp học','Tạo lớp trước khi soạn bài kiểm tra.','<button class="btn primary" onclick="navigate(\'classes\')">Đến trang lớp học</button>')}`}
async function editQuiz(id){const q=await api(`/api/quizzes/${id}`);editorQuestions=q.questions.map(x=>({...x}));navigate('editor',{classId:q.class_id,className:route.className,quizId:id,title:q.title,description:q.description||''})}
async function renderEditor(){if(!editorQuestions.length)editorQuestions=[blankQuestion()];const editing=!!route.quizId;appRoot.innerHTML=`<div class="panel-head"><div><button class="btn outline sm" onclick="navigate('detail',{classId:${route.classId}})">← Quay lại lớp</button><div class="muted small" style="margin-top:10px">Lớp học · ${esc(route.className||'')}</div></div></div><form onsubmit="saveQuiz(event)"><div class="panel"><h2>Thông tin bài kiểm tra</h2><div class="form-grid"><div class="full"><label>Tên bài kiểm tra</label><input class="field" name="title" value="${esc(route.title||'')}" placeholder="VD: Kiểm tra WiFi và Bluetooth" required></div><div class="full"><label>Mô tả <span class="muted">(không bắt buộc)</span></label><textarea class="field" name="description" placeholder="Mục tiêu hoặc nội dung bài kiểm tra">${esc(route.description||'')}</textarea></div></div></div><div class="panel"><div class="panel-head"><div><h2 style="margin:0">Danh sách câu hỏi</h2><div class="muted small">Mỗi câu gồm bốn lựa chọn và một đáp án đúng.</div></div><button type="button" class="btn secondary" onclick="addQuestionEditor()">＋ Thêm câu hỏi</button></div><div id="question-editors">${editorQuestions.map((q,i)=>questionEditor(q,i)).join('')}</div><div class="form-actions"><button class="btn primary">${editing?'Lưu thay đổi':'Lưu bài kiểm tra'}</button></div></div></form>`}
function newQuiz(classId){editorQuestions=[];navigate('editor',{classId,className:route.className})}
function blankQuestion(){return {question_text:'',option_a:'',option_b:'',option_c:'',option_d:'',correct_answer:'A'}}
function questionEditor(q,i){return `<div class="question-editor"><div class="question-head"><strong>Câu ${i+1}</strong><button type="button" class="btn danger sm" onclick="removeQuestionEditor(${i})">Xóa câu</button></div><label>Nội dung câu hỏi</label><textarea class="field qe-text">${esc(q.question_text)}</textarea><div class="option-fields" style="margin-top:12px">${'ABCD'.split('').map(letter=>`<div class="option-input"><b>${letter}</b><input class="field qe-${letter.toLowerCase()}" value="${esc(q['option_'+letter.toLowerCase()])}" placeholder="Nội dung đáp án ${letter}"></div>`).join('')}</div><div style="max-width:240px;margin-top:13px"><label>Đáp án đúng</label><select class="field qe-correct">${'ABCD'.split('').map(a=>`<option ${q.correct_answer===a?'selected':''}>${a}</option>`).join('')}</select></div></div>`}
function syncQuestionEditors(){document.querySelectorAll('.question-editor').forEach((el,i)=>{if(!editorQuestions[i])return;editorQuestions[i]={...editorQuestions[i],question_text:el.querySelector('.qe-text').value,...Object.fromEntries('abcd'.split('').map(a=>['option_'+a,el.querySelector('.qe-'+a).value])),correct_answer:el.querySelector('.qe-correct').value}})}
function addQuestionEditor(){syncQuestionEditors();editorQuestions.push(blankQuestion());renderEditor()}
function removeQuestionEditor(i){syncQuestionEditors();editorQuestions.splice(i,1);if(!editorQuestions.length)editorQuestions.push(blankQuestion());renderEditor()}
async function saveQuiz(e){e.preventDefault();syncQuestionEditors();const form=Object.fromEntries(new FormData(e.target));const body={...form,questions:editorQuestions};try{if(route.quizId)await api(`/api/quizzes/${route.quizId}`,{method:'PUT',body:JSON.stringify(body)});else{const saved=await api(`/api/classes/${route.classId}/quizzes`,{method:'POST',body:JSON.stringify(body)});route.quizId=saved.id}toast('Đã lưu bài kiểm tra');navigate('detail',{classId:route.classId,className:route.className})}catch(err){toast(err.message)}}
async function startQuiz(id){try{const d=await api(`/api/quizzes/${id}/sessions`,{method:'POST',body:'{}'});navigate('live',{sessionId:d.id,className:route.className,classId:route.classId})}catch(e){toast(e.message)}}
async function renderLive(){await loadLive();liveTimer=setInterval(()=>loadLive(true),1800)}
async function loadLive(silent=false){try{const d=await api(`/api/sessions/${route.sessionId}`);liveData=d;route.className=d.session.class_name;route.classId=d.session.class_id;setHeader();const s=d.session,q=d.current_question,idx=d.questions.findIndex(x=>x.id===s.current_question_id);if(s.status==='completed'&&liveTimer){clearInterval(liveTimer);liveTimer=null}appRoot.innerHTML=`<div class="row between" style="margin-bottom:16px"><div><div class="muted small">${esc(s.class_name)} · ${esc(s.quiz_title)}</div><div style="margin-top:6px"><span class="pill ${s.accepting_answers?'':'closed'}"><i class="dot"></i>${s.accepting_answers?'Đang nhận đáp án':s.status==='completed'?'Đã kết thúc':'Đã đóng nhận'}</span></div></div>${s.status==='completed'?`<button class="btn primary" onclick="navigate('result',{sessionId:${s.id}})">Xem kết quả</button>`:`<button class="btn danger" onclick="endSession()">Kết thúc phiên</button>`}</div><div class="live-layout"><div><div class="panel question-live">${q?`<div class="question-number">CÂU ${idx+1} / ${d.questions.length}</div><h2>${esc(q.question_text)}</h2>${'ABCD'.split('').map(a=>`<div class="answer-choice"><b>${a}.</b>${esc(q['option_'+a.toLowerCase()])}</div>`).join('')}<div class="notice">Đáp án đúng: <strong>${q.correct_answer}</strong></div>`:empty('Chưa có câu hiện tại','Chọn một câu hỏi để tiếp tục.')}</div><div class="panel"><div class="live-controls"><button class="btn secondary" onclick="control('previous')" ${idx<=0?'disabled':''}>← Câu trước</button><button class="btn secondary" onclick="control('next')" ${idx>=d.questions.length-1?'disabled':''}>Câu tiếp →</button><select class="field" style="width:auto" aria-label="Chọn câu hỏi" onchange="control('go',this.value)">${d.questions.map((question,i)=>`<option value="${question.id}" ${question.id===s.current_question_id?'selected':''}>Câu ${i+1}</option>`).join('')}</select></div><div class="muted small" style="margin-top:12px">Nhận đáp án tự động trong toàn bộ phiên; chuyển câu sẽ cập nhật thiết bị ESP32.</div></div></div><div><div class="grid stats-grid" style="grid-template-columns:1fr 1fr">${statCard('↗','Đã trả lời',d.stats.total)}${statCard('✓','Đúng',d.stats.correct)}${statCard('×','Sai',d.stats.wrong)}${statCard('%','Tỷ lệ đúng',`${d.stats.correct_percent}%`)}</div><div class="panel"><h2>Phân bố đáp án</h2>${'ABCD'.split('').map(a=>{const count=d.options[a]||0,pct=d.stats.total?Math.round(count*100/d.stats.total):0;return `<div class="bar-row"><strong>${a}</strong><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-count">${count} · ${pct}%</div></div>`}).join('')}</div></div></div><div class="panel"><div class="panel-head"><h2>Danh sách sinh viên trả lời</h2><span class="muted small">Tự cập nhật mỗi 2 giây</span></div>${d.responses.length?table(['MSSV','Đáp án','Kết quả','Thời gian'],d.responses.map(r=>[esc(r.mssv),`<strong>${esc(r.answer)}</strong>`,`<span class="badge ${r.result==='Dung'?'':'bad'}">${r.result==='Dung'?'Đúng':'Sai'}</span>`,esc(r.updated_at)])):empty('Chưa có câu trả lời','Sinh viên có thể trả lời ngay khi phiên đang hoạt động.')}</div>`}catch(e){if(!silent)toast(e.message)}}
async function control(action,questionId){try{await api(`/api/sessions/${route.sessionId}/control`,{method:'POST',body:JSON.stringify({action,question_id:questionId?Number(questionId):undefined})});await loadLive()}catch(e){toast(e.message)}}
async function endSession(){if(!confirm('Bạn có chắc muốn kết thúc phiên kiểm tra này? ESP32 sẽ không thể gửi thêm đáp án.'))return;try{await api(`/api/sessions/${route.sessionId}/control`,{method:'POST',body:JSON.stringify({action:'end'})});if(liveData?.session)liveData.session.status='completed';if(liveTimer){clearInterval(liveTimer);liveTimer=null}const destination=route.classId?{page:'detail',classId:route.classId,tab:'quizzes'}:{page:'classes'};route=destination;await render()}catch(e){toast(e.message)}}
async function renderResults(){const rows=await api('/api/results');appRoot.innerHTML=`<div class="panel-head"><div><h2 style="margin:0">Lịch sử kết quả</h2><div class="muted small">Các phiên kiểm tra đã kết thúc và kết quả tương ứng.</div></div></div>${rows.length?table(['Bài kiểm tra','Lớp học','Thời gian','Tham gia','Lượt trả lời',''],rows.map(s=>[esc(s.quiz_title),esc(s.class_name),esc(String(s.started_at).slice(0,16)),nfmt(s.participant_count),nfmt(s.response_count),`<button class="btn outline sm" onclick="navigate('result',{sessionId:${s.id}})">Xem kết quả</button>`])):empty('Chưa có kết quả','Kết quả sẽ hiển thị sau khi kết thúc một phiên kiểm tra.')}`}
async function renderResult(){const d=await api(`/api/sessions/${route.sessionId}/results`),s=d.summary;appRoot.innerHTML=`<div class="panel-head"><div><button class="btn outline sm" onclick="navigate('results')">← Danh sách kết quả</button><div class="muted small" style="margin-top:10px">${esc(s.class_name)} · ${esc(s.quiz_title)}</div><h2 style="margin:4px 0">Kết quả phiên kiểm tra</h2></div><span class="pill closed">Đã kết thúc</span></div><div class="grid stats-grid">${statCard('♙','Sinh viên tham gia',s.participant_count)}${statCard('▤','Tổng số câu hỏi',s.question_count)}${statCard('↗','Lượt trả lời',s.response_count)}${statCard('%','Tỷ lệ đúng chung',`${s.accuracy}%`)}</div><div class="panel"><div class="panel-head"><h2>Kết quả sinh viên</h2></div>${d.students.length?table(['MSSV','Số câu trả lời','Số câu đúng','Số câu sai','Tỷ lệ đúng',''],d.students.map(st=>[esc(st.mssv),nfmt(st.answered),nfmt(st.correct),nfmt(st.wrong),`${st.accuracy||0}%`,`<button class="btn outline sm" onclick="showStudent(${s.id},${st.student_id})">Chi tiết</button>`])):empty('Phiên chưa có sinh viên trả lời','')}</div>`}
async function showStudent(sessionId,studentId){try{const rows=await api(`/api/sessions/${sessionId}/students/${studentId}`);document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(760px,100%)"><div class="panel-head"><h2>Chi tiết câu trả lời</h2><button class="btn outline sm" onclick="closeModal()">Đóng</button></div>${table(['Câu hỏi','Đáp án','Đáp án đúng','Kết quả'],rows.map((r,i)=>[`${i+1}. ${esc(r.question_text)}`,esc(r.answer||'—'),esc(r.correct_answer),r.result?`<span class="badge ${r.result==='Dung'?'':'bad'}">${r.result==='Dung'?'Đúng':'Sai'}</span>`:'<span class="muted">Chưa trả lời</span>']))}</div></div>`}catch(e){toast(e.message)}}
render();
</script>
</body>
</html>
